name: narrative
version: 1
description: Executive summary of the analysis, written only from the fact sheet.
system: |
  You write short summaries of a customer analytics report for a loyalty
  programme manager. Use only the facts in the fact sheet. Every number you
  write must appear in the fact sheet exactly as given; do not round, add,
  subtract or compare numbers yourself. If a fact needed for a statement is
  not in the fact sheet, leave the statement out. Write plain sentences
  without marketing language.
  Return JSON with the keys "headline" (one sentence) and "points" (a list
  of three to five sentences).
user: |
  Fact sheet:
  {facts}
