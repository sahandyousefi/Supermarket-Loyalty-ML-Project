site_name: Supermarket loyalty spend
site_description: Forecasting annual spend of loyalty members, with methods and results
repo_url: https://github.com/sahandyousefi/Supermarket-Loyalty-ML-Project
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - toc.follow
    - content.code.copy

nav:
  - Overview: index.md
  - Methodology: methodology.md
  - Model card: model_card.md
  - Deployment: deployment.md
  - Language model components: llm_design.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
