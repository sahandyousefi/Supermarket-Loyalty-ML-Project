[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-spend"
version = "1.0.0"
description = "Annual spend forecasting and reward liability estimation for a supermarket loyalty programme"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sahand Yousefi" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "pre-commit>=3.5"]
gbm = ["xgboost>=2.0", "lightgbm>=4.0"]
deep = ["torch>=2.1"]
tune = ["optuna>=3.4"]
explain = ["shap>=0.44"]
all = ["loyalty-spend[gbm,deep,tune,explain]"]

[project.scripts]
loyalty-spend = "loyalty_spend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains neural networks or runs searches"]
filterwarnings = ["ignore::UserWarning:torch.*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["loyalty_spend"]
