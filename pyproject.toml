[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-spend"
version = "1.5.0"
description = "Annual spend forecasting and reward liability estimation for a supermarket loyalty programme"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sahand Yousefi" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.5",
    "pre-commit>=3.5",
    "mypy>=1.10",
    "types-PyYAML",
]
gbm = ["xgboost>=2.0", "lightgbm>=4.0"]
deep = ["torch>=2.1"]
tune = ["optuna>=3.4"]
explain = ["shap>=0.44"]
tracking = ["mlflow>=2.10"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
parquet = ["pyarrow>=14"]
notebooks = ["nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
all = ["loyalty-spend[gbm,deep,tune,explain,serve,parquet]"]

[project.scripts]
loyalty-spend = "loyalty_spend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loyalty_spend = ["py.typed", "llm/prompts/*.yaml", "llm/eval/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains neural networks, runs searches or starts fresh processes"]
filterwarnings = [
    # Any warning raised from the package itself fails the tests.
    "error:::loyalty_spend",
    "ignore::UserWarning:torch.*",
]

[tool.coverage.run]
source = ["loyalty_spend"]
omit = ["*/reporting/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
files = ["src/loyalty_spend"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "loyalty_spend.data.*",
    "loyalty_spend.config",
    "loyalty_spend.evaluation.*",
    "loyalty_spend.analysis.*",
    "loyalty_spend.models.*",
    "loyalty_spend.uncertainty.*",
    "loyalty_spend.business.*",
    "loyalty_spend.synthetic.*",
    "loyalty_spend.robustness.*",
    "loyalty_spend.causal.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Packages that pass the full strict set, extended one package at a time.
[[tool.mypy.overrides]]
module = [
    "loyalty_spend.business.*",
    "loyalty_spend.evaluation.*",
    "loyalty_spend.synthetic.*",
    "loyalty_spend.robustness.*",
    "loyalty_spend.causal.*",
]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_return_any = true
strict_equality = true
no_implicit_reexport = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["loyalty_spend"]
