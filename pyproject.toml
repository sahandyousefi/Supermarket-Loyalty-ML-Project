[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-spend"
version = "1.3.0"
description = "Annual spend forecasting and reward liability estimation for a supermarket loyalty programme"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sahand Yousefi" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.5",
    "pre-commit>=3.5",
    "mypy>=1.10",
    "types-PyYAML",
]
gbm = ["xgboost>=2.0", "lightgbm>=4.0"]
deep = ["torch>=2.1"]
tune = ["optuna>=3.4"]
explain = ["shap>=0.44"]
tracking = ["mlflow>=2.10"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
all = ["loyalty-spend[gbm,deep,tune,explain,serve]"]

[project.scripts]
loyalty-spend = "loyalty_spend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loyalty_spend = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains neural networks or runs searches"]
filterwarnings = ["ignore::UserWarning:torch.*"]

[tool.coverage.run]
source = ["loyalty_spend"]
omit = ["*/reporting/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
files = ["src/loyalty_spend"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "loyalty_spend.data.*",
    "loyalty_spend.config",
    "loyalty_spend.evaluation.*",
    "loyalty_spend.analysis.*",
    "loyalty_spend.models.*",
    "loyalty_spend.uncertainty.*",
    "loyalty_spend.business.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["loyalty_spend"]
