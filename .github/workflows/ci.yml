name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hooks
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,all]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q -m "not slow" --cov=loyalty_spend --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release metadata
        run: python scripts/check_release.py
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel
        run: |
          pip install dist/*.whl
          cd /tmp && loyalty-spend --version
          python -c "import importlib.resources as r; assert r.files('loyalty_spend').joinpath('py.typed').is_file()"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the documentation site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          python -m pip install -e ".[docs]"
          mkdocs build --strict

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install ".[gbm,tune,explain,serve,parquet]"
          pip-audit --skip-editable --desc

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train a model to serve
        run: |
          python -m pip install .
          loyalty-spend train --model ols --output artifacts/model.joblib
          chmod -R a+rX artifacts
      - name: Build the service image
        run: docker build --target serve -t loyalty-spend-api:ci .
      - name: Start the container and score a member
        run: |
          docker run -d --name api -p 8000:8000 \
            -v "$PWD/artifacts:/app/artifacts:ro" loyalty-spend-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/version
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"customers": [{"customer_id": 1, "first_month": 20.5,
                 "items_in_first_month": 10, "region": "Europe",
                 "loyalty_years": "1-3", "joining_month": "Jan",
                 "promotion": "No"}]}'
      - name: Show the container log
        if: always()
        run: docker logs api || true
