paths:
  raw_dir: data/raw
  loyalty_file: loyalty.csv
  train_file: train.csv
  test_file: test.csv
  output_dir: artifacts
  report_dir: reports

cv:
  n_splits: 5
  n_repeats: 3
  seed: 42

deep:
  epochs: 400
  batch_size: 64
  learning_rate: 0.003
  weight_decay: 0.0001
  patience: 40
  val_fraction: 0.15
  seed: 0

rewards:
  # Illustrative tier schedule: [minimum annual spend, reward rate]
  tiers:
    - [0, 0.00]
    - [100, 0.02]
    - [125, 0.03]
    - [140, 0.05]
  n_simulations: 5000
  seed: 7

conformal:
  alpha: 0.1
  calibration_size: 0.25
